# Sur le Pi : docker compose up -d --build
# Depuis le wifi : http://<ip-du-pi>:8000
# Depuis l'extérieur : https://biche-verriere.duckdns.org:8443 (via Caddy,
# la Livebox redirige le port 8443 vers le Pi).

services:

  web:
    build: .
    restart: unless-stopped
    env_file: .env                     # CODE_SECRET_RELEVE et DJANGO_SECRET_KEY
    environment:
      VERRIERE_HARDWARE: real
      VERRIERE_ALLOWED_HOSTS: "*"
      # VERRIERE_PUBLIC_URL (dans .env) : autorise les formulaires derrière Caddy
      VERRIERE_DB_PATH: /data/db.sqlite3
      TZ: Europe/Paris
    ports:
      - "8000:8000"
    volumes:
      - verriere-data:/data            # la base SQLite survit aux rebuilds
    privileged: true                   # donne au conteneur l'accès aux broches GPIO du Pi

  scheduler:
    image: alpine:3.20                 # multi-arch (dont armv7), contient wget
    restart: unless-stopped
    depends_on:
      - web
    env_file: .env                     # pour CODE_SECRET_RELEVE
    entrypoint: ["/bin/sh", "-c"]
    command:
      # Appelle le backend toutes les 30 s. C'est le backend qui décide
      # s'il est temps de faire un relevé (période réglée dans l'admin).
      - |
        while true; do
          sleep 30
          wget -q -O - http://web:8000/releve/ecrire \
               --header="Content-Type: application/json" \
               --post-data="{\"code_secret\": \"$${CODE_SECRET_RELEVE}\"}" \
            && echo " <- relevé OK $$(date -Iseconds)" \
            || echo "relevé en échec $$(date -Iseconds)"
        done

  caddy:
    build: docker/caddy
    restart: unless-stopped
    env_file: .env                     # VERRIERE_PUBLIC_URL et DUCKDNS_TOKEN
    depends_on:
      - web
    ports:
      - "8443:8443"
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data               # certificats Let's Encrypt, survivent aux rebuilds
      - caddy-config:/config

volumes:
  verriere-data:
  caddy-data:
  caddy-config:
